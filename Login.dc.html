<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/winwin-design-system-e4218ea3-d18f-4c39-adb0-e570266012f3/tokens/fonts.css">
<link rel="stylesheet" href="_ds/winwin-design-system-e4218ea3-d18f-4c39-adb0-e570266012f3/tokens/fig-tokens.css">
<link rel="stylesheet" href="_ds/winwin-design-system-e4218ea3-d18f-4c39-adb0-e570266012f3/tokens/fig-typography.css">
<link rel="stylesheet" href="_ds/winwin-design-system-e4218ea3-d18f-4c39-adb0-e570266012f3/tokens/semantic.css">
<link rel="stylesheet" href="_ds/winwin-design-system-e4218ea3-d18f-4c39-adb0-e570266012f3/components/fig-assets.css">
<link rel="stylesheet" href="_ds/winwin-design-system-e4218ea3-d18f-4c39-adb0-e570266012f3/styles.css">
<script src="_ds/winwin-design-system-e4218ea3-d18f-4c39-adb0-e570266012f3/_ds_bundle.js"></script>
<script src="lamp.js"></script>
<style>
html,body{margin:0;background:#040814;color:#EAF2FF;font-family:"Readex Pro","Cairo",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#7FE7FF;text-decoration:none}
a:hover{color:#FFFFFF}
input,button{font-family:inherit}
input[type=checkbox]{accent-color:#3FE0FF}
</style>
</helmet>
<div style="position:relative;min-height:100vh;overflow:hidden;background:radial-gradient(1200px 700px at 30% -10%, rgba(47,107,255,0.22), transparent 60%), radial-gradient(900px 600px at 105% 105%, rgba(63,224,255,0.08), transparent 60%), #040814;display:flex;flex-direction:column">
  <div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;opacity:0.5;background-image:linear-gradient(rgba(120,170,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(120,170,255,0.05) 1px, transparent 1px);background-size:72px 72px;-webkit-mask-image:radial-gradient(ellipse at 50% 40%, #000 20%, transparent 75%);mask-image:radial-gradient(ellipse at 50% 40%, #000 20%, transparent 75%)"></div>
  <header style="position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px max(20px,4vw)">
    <a href="AI Experience Lab.dc.html" style="display:flex;align-items:center;gap:10px;color:#EAF2FF;font-weight:600;font-size:15px">
      <img src="assets/fadaat-logo.png" alt="Fadaat" style="height:26px;width:auto;display:block;filter:brightness(0) invert(1)">
      <span style="width:1px;height:20px;background:rgba(150,190,255,0.3)"></span>
      <span>AI Experience Lab</span>
    </a>
    <a href="AI Experience Lab.dc.html" style="font-size:14px;color:#C9D8F5">← Back to the lab</a>
  </header>
  <main style="position:relative;z-index:2;flex:1;display:flex;align-items:center;justify-content:center;padding:20px max(16px,4vw) 48px">
    <div style="width:min(860px,100%);display:grid;grid-template-columns:{{ cols }};border-radius:32px;overflow:hidden;background:linear-gradient(160deg, rgba(20,40,90,0.55), rgba(6,12,30,0.85));border:1px solid rgba(150,190,255,0.18);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:inset 0 1px 0 rgba(255,255,255,0.08), 0 60px 120px -50px rgba(47,107,255,0.6)">
      <div style="position:relative;height:{{ artH }};border-right:1px solid rgba(150,190,255,0.12)">
        <canvas ref="{{ lampRef }}" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;display:block"></canvas>
        <div style="position:absolute;top:32px;left:36px;right:36px;display:flex;flex-direction:column;gap:8px;pointer-events:none">
          <span style="font-size:13px;letter-spacing:0.16em;text-transform:uppercase;color:#8FB4FF;font-weight:500">{{ artKicker }}</span>
          <span style="font-size:15px;line-height:1.5;color:#B9CCF0;max-width:300px">{{ artText }}</span>
        </div>
      </div>
      <div style="position:relative;padding:clamp(24px,3.5vw,40px);display:flex;flex-direction:column;justify-content:center">
        <span aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 0% 70%, rgba(120,230,255,0.22), rgba(63,160,255,0.06) 45%, transparent 70%);opacity:{{ glow }};transition:opacity 1s ease"></span>
        <div style="position:relative;display:flex;flex-direction:column;gap:18px;opacity:{{ formOp }};transform:{{ formTf }};filter:{{ formFilter }};transition:opacity 1s ease, transform 1.1s cubic-bezier(.2,.7,.2,1), filter 1s ease">
          <sc-if value="{{ showForm }}" hint-placeholder-val="{{ true }}">
            <div style="display:flex;flex-direction:column;gap:8px">
              <h1 style="margin:0;font-size:clamp(26px,2.6vw,34px);line-height:1.05;letter-spacing:-0.03em;font-weight:600">Welcome back</h1>
              <p style="margin:0;font-size:16px;line-height:1.6;color:#B9CCF0">Sign in to your AI Experience Lab account.</p>
            </div>
            <form onSubmit="{{ submit }}" noValidate="{{ true }}" style="display:flex;flex-direction:column;gap:14px">
              <label style="display:flex;flex-direction:column;gap:7px"><span style="font-size:13px;color:#9CC2FF">Email</span><input type="email" value="{{ email }}" onInput="{{ onEmail }}" onFocus="{{ wake }}" autoComplete="email" style="height:44px;padding:0 14px;border-radius:12px;border:1px solid rgba(150,190,255,0.2);background:rgba(4,10,28,0.55);color:#EAF2FF;font-size:15px;outline:none;transition:border-color .3s, box-shadow .3s" style-focus="border-color:#3FE0FF;box-shadow:0 0 0 4px rgba(63,224,255,0.15), 0 0 30px rgba(63,224,255,0.2)"></label>
              <label style="display:flex;flex-direction:column;gap:7px">
                <span style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span style="font-size:13px;color:#9CC2FF">Password</span><a href="#" onClick="{{ forgot }}" style="font-size:13px">Forgot password?</a></span>
                <span style="position:relative;display:flex">
                  <input type="{{ pwType }}" value="{{ pw }}" onInput="{{ onPw }}" onFocus="{{ wake }}" autoComplete="current-password" style="flex:1;height:44px;padding:0 76px 0 14px;border-radius:12px;border:1px solid rgba(150,190,255,0.2);background:rgba(4,10,28,0.55);color:#EAF2FF;font-size:15px;outline:none;transition:border-color .3s, box-shadow .3s" style-focus="border-color:#3FE0FF;box-shadow:0 0 0 4px rgba(63,224,255,0.15), 0 0 30px rgba(63,224,255,0.2)">
                  <button type="button" onClick="{{ togglePw }}" style="position:absolute;right:5px;top:5px;height:34px;padding:0 12px;border-radius:9999px;border:none;background:rgba(255,255,255,0.06);color:#C9D8F5;font-size:12px;cursor:pointer">{{ pwLabel }}</button>
                </span>
              </label>
              <label style="display:flex;align-items:center;gap:10px;font-size:14px;color:#C9D8F5;cursor:pointer"><input type="checkbox" checked="{{ remember }}" onChange="{{ onRemember }}" style="width:16px;height:16px">Keep me signed in</label>
              <sc-if value="{{ err }}"><span role="alert" style="font-size:13px;color:#FFB4A8">{{ err }}</span></sc-if>
              <button type="submit" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;border:none;border-radius:9999px;background:linear-gradient(135deg,#4FB2FF,#3FE0FF);color:#03122B;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 14px 40px -12px rgba(63,224,255,0.7);transition:transform .25s, box-shadow .25s" style-hover="transform:translateY(-2px);box-shadow:0 20px 50px -12px rgba(63,224,255,0.9)">{{ btnLabel }}<span aria-hidden="true">→</span></button>
            </form>
            <span style="font-size:12px;color:#7F9BCB">Preview sign-in · not connected to an account system yet.</span>
          </sc-if>
          <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
            <div role="status" style="display:flex;flex-direction:column;align-items:flex-start;gap:16px">
              <span style="width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 35%, #E6FBFF, #3FE0FF 40%, #2F6BFF 80%);box-shadow:0 0 50px rgba(63,224,255,0.6);color:#03122B;font-size:28px;font-weight:700">✓</span>
              <h1 style="margin:0;font-size:clamp(28px,3vw,40px);line-height:1.1;font-weight:600;letter-spacing:-0.02em">You’re in.</h1>
              <p style="margin:0;font-size:16px;line-height:1.6;color:#B9CCF0">This is a preview, so no account was checked.</p>
              <a href="AI Experience Lab.dc.html" style="display:inline-flex;align-items:center;height:46px;padding:0 20px;border-radius:9999px;border:1px solid rgba(63,224,255,0.4);background:rgba(63,224,255,0.08);color:#EAFBFF;font-size:14px">Go to the lab →</a>
            </div>
          </sc-if>
        </div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { on: false, email: '', pw: '', showPw: false, remember: true, err: '', status: 'idle', narrow: false };
  lampRef = el => { this.cv = el; if (el) this.init(); else if (this.lamp) { this.lamp.destroy(); this.lamp = null; } };
  init() {
    if (this.lamp || !this.cv) return;
    if (!window.WWLamp) { clearTimeout(this.wait); this.wait = setTimeout(() => this.init(), 200); return; }
    this.lamp = window.WWLamp(this.cv, { on: this.state.on, cx: 0.5, baseY: 0.84, scale: 0.82, hint: 'Pull to sign in', onToggle: on => this.setState({ on }) });
  }
  onResize = () => { const n = innerWidth < 860; if (n !== this.state.narrow) this.setState({ narrow: n }); };
  componentDidMount() { this.onResize(); addEventListener('resize', this.onResize); }
  componentWillUnmount() { removeEventListener('resize', this.onResize); clearTimeout(this.wait); clearTimeout(this.t); if (this.lamp) this.lamp.destroy(); }
  setOn(v) { this.lamp ? this.lamp.setOn(v) : this.setState({ on: v }); }
  submit = e => {
    e.preventDefault(); const s = this.state; if (s.status === 'loading') return;
    if (!this.state.on) this.setOn(true);
    if (!/^\S+@\S+\.\S+$/.test(s.email.trim())) return this.setState({ err: 'Please enter a valid email address.' });
    if (s.pw.length < 6) return this.setState({ err: 'Password must be at least 6 characters.' });
    this.setState({ err: '', status: 'loading' });
    this.t = setTimeout(() => this.setState({ status: 'done' }), 1200);
  };
  renderVals() {
    const s = this.state, on = s.on;
    return {
      cols: s.narrow ? 'minmax(0,1fr)' : 'minmax(0,1fr) minmax(0,1fr)', artH: s.narrow ? '340px' : '480px', lampRef: this.lampRef,
      artKicker: on ? 'Lights on' : 'Lights off', artText: on ? 'Good to see you. Sign in to continue.' : 'It’s a little dark in here. Pull the lamp cord to see the sign-in form.',
      on, glow: on ? 1 : 0, formOp: on ? 1 : 0.32, formTf: on ? 'none' : 'translateY(10px)', formFilter: on ? 'none' : 'saturate(0.3) blur(0.5px)',
      toggle: () => this.setOn(!on), toggleLabel: on ? 'Light on' : 'Turn on the light', dot: on ? '#3FE0FF' : 'rgba(150,190,255,0.4)', dotGlow: on ? '0 0 10px #3FE0FF' : 'none',
      wake: () => { if (!this.state.on) this.setOn(true); },
      email: s.email, onEmail: e => this.setState({ email: e.target.value, err: '' }), pw: s.pw, onPw: e => this.setState({ pw: e.target.value, err: '' }),
      pwType: s.showPw ? 'text' : 'password', pwLabel: s.showPw ? 'Hide' : 'Show', togglePw: () => this.setState({ showPw: !s.showPw }),
      remember: s.remember, onRemember: e => this.setState({ remember: e.target.checked }),
      forgot: e => { e.preventDefault(); this.setState({ err: 'Password reset isn’t connected in this preview.' }); },
      err: s.err, submit: this.submit, btnLabel: s.status === 'loading' ? 'Signing in…' : 'Sign in',
      showForm: s.status !== 'done', done: s.status === 'done'
    };
  }
}
</script>
</body>
</html>
